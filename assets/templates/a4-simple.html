<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="An empty, editable A4 chapter template with print and HTML saving controls.">
<title>A4 Chapter — Empty Template</title>
<style>
:root{--ink:#26313b;--muted:#6a7681;--line:#dde4eb;--blue:#23538b;--page-width:210mm;--page-height:297mm;--page-padding:18mm}
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:var(--ink);font-family:Georgia,'Times New Roman',serif}.actions{position:fixed;top:16px;right:24px;z-index:10;display:flex;gap:8px;padding:8px;border:1px solid #d5dee7;background:#ffffffed;border-radius:8px;box-shadow:0 3px 12px #2437460b}.actions button{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:13px Arial,Helvetica,sans-serif;color:#263746;background:white;border:1px solid #c9d4df;border-radius:4px;padding:9px 13px;cursor:pointer}.actions button:hover{background:#eff5fb}.actions button:focus-visible,.add-page:focus-visible,[contenteditable]:focus-visible{outline:2px solid #8aafe0;outline-offset:3px}.actions svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.workspace{padding:92px 24px 30px;overflow-x:auto}.pages{display:flex;flex-direction:column;align-items:center;gap:24px;min-width:var(--page-width)}.a4-page{position:relative;width:var(--page-width);height:var(--page-height);flex:none;background:white;box-shadow:0 5px 24px #24374612;border:1px solid #dde4eb;padding:var(--page-padding)}.page-content{height:calc(var(--page-height) - 2 * var(--page-padding) - 10mm);display:flex;flex-direction:column;gap:0}.chapter-header{flex:none;margin-bottom:8mm}.chapter-label{font:11px/1.6 Arial,sans-serif;letter-spacing:1.8px;text-transform:uppercase;color:var(--blue);min-height:18px}.chapter-title{font:700 34px/1.16 Arial,Helvetica,sans-serif;letter-spacing:-.8px;margin:9px 0 12px;min-height:42px}.chapter-description{font:18px/1.6 Georgia,serif;min-height:30px;margin:0;color:#53616e}.chapter-body{flex:1;min-height:0;overflow-y:auto;font:16px/1.7 Georgia,serif;overflow-wrap:anywhere}.chapter-body p{margin:0 0 12px}.chapter-body h2{font:700 24px/1.3 Arial,sans-serif;margin:24px 0 14px;break-after:avoid}.chapter-body h3{font:700 18px/1.4 Arial,sans-serif;margin:22px 0 10px;break-after:avoid}.chapter-body ul,.chapter-body ol{padding-left:22px}.chapter-body li{margin:5px 0}.chapter-body blockquote{margin:18px 0;border-left:3px solid #becbd6;padding:8px 18px;font-size:18px;break-inside:avoid}.chapter-body pre{font:12px/1.6 Consolas,'Liberation Mono',monospace;white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;background:#f5f8fb;border:1px solid #dce4ec;border-radius:3px;break-inside:avoid}.chapter-body code{font-family:Consolas,'Liberation Mono',monospace}.chapter-body table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;line-height:1.5;margin:18px 0}.chapter-body th,.chapter-body td{border-bottom:1px solid #dce4ec;text-align:left;padding:9px;vertical-align:top;overflow-wrap:anywhere}.chapter-body th{font-family:Arial,sans-serif;background:#f1f4f7}.chapter-body figure{margin:20px 0;padding:10px;border:1px solid #dce4ec;break-inside:avoid}.chapter-body img,.chapter-body svg{max-width:100%;height:auto}.chapter-body figcaption,.chapter-body .source-note{font:11px/1.5 Arial,sans-serif;color:#687681;margin-top:8px}.chapter-body .hint{padding:12px 16px;margin:18px 0;border-left:3px solid #b18536;background:#fff9ed;break-inside:avoid}.chapter-body .note{padding:12px 16px;margin:18px 0;border-left:3px solid #23538b;background:#f1f6fb;break-inside:avoid}[contenteditable]{outline:none}[contenteditable]:empty:before{content:attr(data-placeholder);color:#b0bac3;pointer-events:none}[contenteditable]:hover{outline:1px dashed #d6e1eb;outline-offset:5px}[contenteditable]:focus{outline:1px dashed #aac4df;outline-offset:5px}.page-footer{position:absolute;left:var(--page-padding);right:var(--page-padding);bottom:12mm;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e4e9ee;padding-top:3mm;font:10px/1.5 Arial,sans-serif;color:#89949e;gap:16px}.footer-title{min-width:120px;flex:1;min-height:15px}.page-number{white-space:nowrap}.page-overflow{position:absolute;left:18mm;right:18mm;bottom:23mm;padding:8px;background:#fff1ee;border:1px solid #edb5aa;color:#853e31;font:11px/1.5 Arial,sans-serif;display:none}.a4-page.overflow{outline:2px solid #cd765f}.a4-page.overflow .page-overflow{display:block}.template-controls{min-width:var(--page-width);text-align:center;padding:22px 0 10px;font:12px/1.7 Arial,sans-serif;color:#6b7783}.add-page{border:1px solid #c9d4df;border-radius:4px;background:#fff;color:#42566a;padding:9px 16px;cursor:pointer;font:13px Arial,sans-serif}.template-controls p{margin:10px 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font:12px/1.5 Arial,sans-serif;background:#263746;color:#fff;padding:9px 16px;border-radius:5px;z-index:20;max-width:90vw}.toast:empty{display:none}
@page{size:A4 portrait;margin:0}
@media print{html,body{width:210mm;margin:0;padding:0;background:white;-webkit-print-color-adjust:exact;print-color-adjust:exact}.actions,.template-controls,.toast,.page-overflow{display:none!important}.workspace{padding:0;margin:0;overflow:visible}.pages{display:block;min-width:0}.a4-page{width:210mm;height:297mm;margin:0;border:0;box-shadow:none;break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid}.a4-page:last-child{break-after:auto;page-break-after:auto}.a4-page.overflow{outline:none}.chapter-body{overflow:visible}[contenteditable],[contenteditable]:hover,[contenteditable]:focus{outline:none!important}[contenteditable]:empty:before{content:none!important}.chapter-header{break-after:avoid}.chapter-body table tr{break-inside:avoid}}
@media(max-width:850px){.actions{top:10px;right:12px;gap:5px;padding:6px}.actions button{font-size:12px;padding:8px 10px}.workspace{padding:78px 12px 24px}.pages{align-items:flex-start}.template-controls{text-align:left}}
</style>
</head>
<body>
<div class="actions" role="toolbar" aria-label="Chapter file actions">
<button type="button" id="print-button" title="Print on A4 paper, or choose Save as PDF in your print dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7z"/><path d="M17 11h1"/></svg>Print</button>
<button type="button" id="save-button" title="Choose a file name and save an HTML copy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h13l3 3v15H4zM7 3v6h9V3M7 21v-8h10v8"/></svg>Save As</button>
<button type="button" id="download-button" title="Download the current chapter as an HTML file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>Download</button>
</div>
<main class="workspace">
<div class="pages" id="pages">
<article class="a4-page" aria-label="A4 page 1">
<div class="page-content">
<header class="chapter-header">
<div class="chapter-label" contenteditable="true" data-placeholder="Chapter number / category" aria-label="Chapter number or category" spellcheck="true"></div>
<h1 class="chapter-title" contenteditable="true" data-placeholder="Chapter title" aria-label="Chapter title" spellcheck="true"></h1>
<p class="chapter-description" contenteditable="true" data-placeholder="Introduction or short description" aria-label="Chapter introduction" spellcheck="true"></p>
</header>
<div class="chapter-body" contenteditable="true" data-placeholder="Chapter content" aria-label="Chapter content" spellcheck="true"></div>
</div>
<div class="page-overflow" role="status">This page is full. Move some content to another A4 page before printing or saving.</div>
<footer class="page-footer"><div class="footer-title" contenteditable="true" data-placeholder="Book / source" aria-label="Book or source footer"></div><span class="page-number">1 / 1</span></footer>
</article>
</div>
<div class="template-controls"><button type="button" class="add-page" id="add-page">+ Add A4 page</button><p>210 × 297 mm · Click the pale placeholders to write. Empty placeholders do not print.</p></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- Reusable chapter-body elements, when content is added:
     h2 / h3 / p / table / figure + figcaption / pre + code /
     blockquote / div.hint / div.note / p.source-note.
     The initial template intentionally contains no sample chapter text. -->
<script>
(() => {
  const pages = document.getElementById('pages');
  const toast = document.getElementById('toast');
  const defaultName = 'A4_Chapter_Empty_Template.html';
  let notification;

  function notify(message) {
    clearTimeout(notification);
    toast.textContent = message;
    notification = setTimeout(() => { toast.textContent = ''; }, 3500);
  }

  function updatePages() {
    const sheets = Array.from(pages.querySelectorAll('.a4-page'));
    sheets.forEach((sheet, index) => {
      sheet.setAttribute('aria-label', 'A4 page ' + (index + 1));
      sheet.querySelector('.page-number').textContent = (index + 1) + ' / ' + sheets.length;
      const content = sheet.querySelector('.page-content');
      const body = sheet.querySelector('.chapter-body');
      const footer = sheet.querySelector('.page-footer');
      const overflow = body.scrollHeight > body.clientHeight + 2 ||
        content.scrollHeight > content.clientHeight + 2 ||
        footer.getBoundingClientRect().height > 32;
      sheet.classList.toggle('overflow', overflow);
    });
  }

  function validatePages() {
    updatePages();
    const sheets = Array.from(pages.querySelectorAll('.a4-page'));
    const index = sheets.findIndex(sheet => sheet.classList.contains('overflow'));
    if (index >= 0) {
      notify('Page ' + (index + 1) + ' exceeds A4. Move excess content to another page.');
      sheets[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
      return false;
    }
    return true;
  }

  function suggestedName() {
    const title = pages.querySelector('.chapter-title').textContent.trim();
    if (!title) return defaultName;
    const safe = title.replace(/[<>:"/\\|?*\u0000-\u001f]/g, '').replace(/\s+/g, '_').slice(0, 100);
    return (safe || 'Chapter') + '.html';
  }

  function serialize() {
    const copy = document.documentElement.cloneNode(true);
    copy.querySelector('#toast').textContent = '';
    copy.querySelectorAll('.overflow').forEach(element => element.classList.remove('overflow'));
    copy.querySelectorAll('[contenteditable]').forEach(element => {
      if (!element.textContent.trim() && !element.querySelector('img,svg,table,pre')) element.innerHTML = '';
    });
    return '<!doctype html>\n' + copy.outerHTML;
  }

  function download(name) {
    const filename = /\.html?$/i.test(name) ? name : name + '.html';
    const blob = new Blob([serialize()], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    notify('HTML copy prepared: ' + filename);
  }

  document.getElementById('print-button').addEventListener('click', () => {
    if (validatePages()) window.print();
  });
  document.getElementById('save-button').addEventListener('click', () => {
    if (!validatePages()) return;
    const name = window.prompt('Save this chapter as an HTML file. Enter a file name:', suggestedName());
    if (name && name.trim()) {
      const safe = name.trim().replace(/[<>:"/\\|?*\u0000-\u001f]/g, '').slice(0, 150);
      if (safe) download(safe);
    }
  });
  document.getElementById('download-button').addEventListener('click', () => {
    if (validatePages()) download(suggestedName());
  });
  document.getElementById('add-page').addEventListener('click', () => {
    const next = pages.querySelector('.a4-page').cloneNode(true);
    next.classList.remove('overflow');
    next.querySelectorAll('[contenteditable]').forEach(element => { element.innerHTML = ''; });
    pages.appendChild(next);
    updatePages();
    next.scrollIntoView({ behavior: 'smooth', block: 'start' });
    next.querySelector('.chapter-title').focus({ preventScroll: true });
  });
  pages.addEventListener('input', () => requestAnimationFrame(updatePages));
  pages.addEventListener('focusout', event => {
    const element = event.target;
    if (element.hasAttribute('contenteditable') && !element.textContent.trim() && !element.querySelector('img,svg,table,pre')) element.innerHTML = '';
    updatePages();
  });
  pages.addEventListener('load', updatePages, true);
  window.addEventListener('resize', updatePages);
  document.addEventListener('keydown', event => {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'p') {
      event.preventDefault();
      if (validatePages()) window.print();
    }
  });
  updatePages();
})();
</script>
</body>
</html>
