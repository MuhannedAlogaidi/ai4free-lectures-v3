[project]
name            = "my-project"
version         = "0.1.0"
description     = "Production RAG system"
requires-python = ">=3.12"
dependencies    = [
    "google-genai>=2.29.0",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]

[tool.uv]
default-groups = ["dev", "notebooks"]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length    = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
